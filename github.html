<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>agents 仓库列表</title>
  <style>
    :root {
      color-scheme: light;
      --text: #1f2328;
      --muted: #6e7781;
      --line: #d0d7de;
      --soft-line: #eef1f4;
      --link: #0969da;
      --bg: #ffffff;
      --soft-bg: #f6f8fa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      width: min(980px, 100%);
      max-width: 980px;
      min-height: 0;
      margin: 0 auto;
      padding: 32px 16px 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
    }

    input:focus {
      border-color: var(--link);
      outline: 2px solid rgba(9, 105, 218, 0.15);
    }

    .status {
      flex: 0 0 auto;
      padding: 10px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .list {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      border-top: 1px solid var(--soft-line);
    }

    .item {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--soft-line);
      font-size: 14px;
    }

    .type {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .path {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .dir-button {
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--link);
      cursor: pointer;
      font: inherit;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .dir-button:hover {
      text-decoration: underline;
    }

    .actions {
      display: flex;
      gap: 10px;
      white-space: nowrap;
    }

    .action-button {
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
    }

    .action-button:hover {
      text-decoration: underline;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .secondary {
      color: var(--muted);
    }

    .empty {
      padding: 18px 0;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      body {
        padding-top: 20px;
        padding-bottom: 18px;
      }

      .item {
        grid-template-columns: 44px minmax(0, 1fr);
      }

      .actions {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <h1>agents 仓库列表</h1>
  <div class="meta">
    <span>仓库：<a id="repoLink" href="https://github.com/404nffff/agents" target="_blank" rel="noreferrer">404nffff/agents</a></span>
    <span>分支：<strong id="branchName">master</strong></span>
  </div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索文件或目录，例如 query.sh / INSTALL.md / shell/" autocomplete="off" />
  </div>

  <div id="status" class="status">加载中...</div>
  <div id="list" class="list"></div>

  <script>
    const repoConfig = {
      owner: "404nffff",
      repo: "agents",
      branch: "master",
    };

    const githubRepo = `https://github.com/${repoConfig.owner}/${repoConfig.repo}`;
    const githubApiBases = /^https?:$/.test(window.location.protocol)
      ? [`${window.location.origin}/github-api`, "https://api.github.com"]
      : ["https://api.github.com"];
    const rootApiPath = `/repos/${repoConfig.owner}/${repoConfig.repo}/contents?ref=${repoConfig.branch}`;
    const treeApiPath = `/repos/${repoConfig.owner}/${repoConfig.repo}/git/trees/${repoConfig.branch}?recursive=1`;
    const rawUrl = path => `https://raw.githubusercontent.com/${repoConfig.owner}/${repoConfig.repo}/${repoConfig.branch}/${path}`;
    const githubFileUrl = path => `${githubRepo}/blob/${repoConfig.branch}/${path}`;
    const githubDirUrl = path => `${githubRepo}/tree/${repoConfig.branch}/${path}`;

    let rootItems = [];
    let allItems = [];
    let currentItems = [];
    const expandedDirs = new Set();
    const directoryChildren = new Map();
    let recursiveLoaded = false;

    function getSearchInput() {
      return document.getElementById("search");
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function createLink(text, href, className) {
      const link = document.createElement("a");
      link.textContent = text;
      link.href = href;
      link.target = "_blank";
      link.rel = "noreferrer";
      if (className) {
        link.className = className;
      }
      return link;
    }

    function createButton(text, className, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = text;
      if (className) {
        button.className = className;
      }
      button.addEventListener("click", onClick);
      return button;
    }

    function render(items) {
      const list = document.getElementById("list");
      list.replaceChildren();
      currentItems = items;
      setStatus(`共 ${items.length} 项`);

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "没有匹配的文件或目录";
        list.appendChild(empty);
        return;
      }

      for (const item of items) {
        appendItemRow(list, item, 0);
      }
    }

    function appendItemRow(list, item, depth) {
        const isFile = item.type === "blob";
        const isExpanded = expandedDirs.has(item.path);
        const row = document.createElement("div");
        row.className = "item";
        row.style.paddingLeft = `${depth * 18}px`;

        const type = document.createElement("span");
        type.className = "type";
        type.textContent = isFile ? "FILE" : "DIR";

        const path = document.createElement("span");
        path.className = "path";
        if (isFile) {
          path.appendChild(createLink(item.path, githubFileUrl(item.path)));
        } else {
          path.appendChild(createButton(`${isExpanded ? "▾" : "▸"} ${item.path}`, "dir-button", () => {
            toggleDirectory(item).catch(error => {
              setStatus(`目录加载失败：${error.message}`);
            });
          }));
        }

        const actions = document.createElement("span");
        actions.className = "actions";
        if (isFile) {
          actions.appendChild(createLink("raw", rawUrl(item.path), "secondary"));
        } else {
          actions.appendChild(createButton(isExpanded ? "收起" : "展开", "action-button", () => {
            toggleDirectory(item).catch(error => {
              setStatus(`目录加载失败：${error.message}`);
            });
          }));
        }

        row.append(type, path, actions);
        list.appendChild(row);

        if (!isFile && isExpanded) {
          const children = directoryChildren.get(item.path) || [];
          for (const child of children) {
            appendItemRow(list, child, depth + 1);
          }
      }
    }

    function contentsApiUrl(path = "") {
      const encodedPath = path
        .split("/")
        .filter(Boolean)
        .map(part => encodeURIComponent(part))
        .join("/");
      const suffix = encodedPath ? `/${encodedPath}` : "";
      return `/repos/${repoConfig.owner}/${repoConfig.repo}/contents${suffix}?ref=${repoConfig.branch}`;
    }

    async function toggleDirectory(item) {
      if (expandedDirs.has(item.path)) {
        expandedDirs.delete(item.path);
        render(currentItems);
        return;
      }

      if (!directoryChildren.has(item.path)) {
        setStatus(`正在加载 ${item.path}...`);
        const data = await fetchGithubJson(contentsApiUrl(item.path));
        directoryChildren.set(item.path, normalizeRootItems(data));
      }

      expandedDirs.add(item.path);
      render(currentItems);
    }

    async function fetchGithubJson(path) {
      let lastError = null;
      for (const base of githubApiBases) {
        try {
          const response = await fetch(`${base}${path}`, { headers: { "Accept": "application/vnd.github+json" } });
          if (response.ok) {
            return response.json();
          }
          let message = `GitHub API ${response.status}`;
          try {
            const error = await response.json();
            message = error.message || message;
          } catch (_error) {
            // 保持 HTTP 状态作为错误信息。
          }
          lastError = new Error(message);
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error("GitHub API 请求失败");
    }

    function normalizeRootItems(items) {
      return (items || [])
        .filter(item => item.type === "file" || item.type === "dir")
        .map(item => ({
          path: item.path,
          type: item.type === "file" ? "blob" : "tree",
        }))
        .sort((a, b) => a.path.localeCompare(b.path));
    }

    function normalizeTreeItems(tree) {
      return (tree || [])
        .filter(item => item.type === "blob" || item.type === "tree")
        .sort((a, b) => a.path.localeCompare(b.path));
    }

    async function loadRootItems() {
      const data = await fetchGithubJson(rootApiPath);
      rootItems = normalizeRootItems(data);
      allItems = rootItems;
      recursiveLoaded = false;
    }

    async function loadRecursiveItems() {
      if (recursiveLoaded) {
        return;
      }
      setStatus("正在搜索全仓库...");
      const data = await fetchGithubJson(treeApiPath);
      allItems = normalizeTreeItems(data.tree);
      recursiveLoaded = true;
    }

    function applySearch() {
      const keyword = getSearchInput().value.trim().toLowerCase();
      const filtered = keyword
        ? allItems.filter(item => item.path.toLowerCase().includes(keyword))
        : allItems;
      render(filtered);
    }

    async function handleSearchInput() {
      const keyword = getSearchInput().value.trim();
      if (keyword) {
        await loadRecursiveItems();
      } else {
        allItems = rootItems;
      }
      applySearch();
    }

    async function main() {
      document.getElementById("repoLink").href = githubRepo;
      document.getElementById("repoLink").textContent = `${repoConfig.owner}/${repoConfig.repo}`;
      document.getElementById("branchName").textContent = repoConfig.branch;
      getSearchInput().value = new URLSearchParams(window.location.search).get("s") || "";

      await loadRootItems();
      await handleSearchInput();
    }

    getSearchInput().addEventListener("input", () => {
      handleSearchInput().catch(error => {
        setStatus(`搜索失败：${error.message}`);
      });
    });

    main().catch(error => {
      setStatus(`加载失败：${error.message}`);
    });
  </script>
</body>
</html>
