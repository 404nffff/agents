services:
  codex:
    image: codex-ubuntu24.04:slim
    build:
      context: ../..
      dockerfile: docker/codex-ubuntu24.04/Dockerfile
    working_dir: /workspace
    env_file:
      - .env
    stdin_open: true
    tty: true
    command:
      - bash
      - -lc
      - |
        cp -a /opt/codex-home/. /root/.codex/
        python3 - <<'PY'
        import json
        import os
        import pathlib
        import sys

        required = ("OPENAI_API_KEY", "OPENAI_BASE_URL")
        missing = [name for name in required if not os.environ.get(name)]
        if missing:
            sys.exit("缺少环境变量: " + ", ".join(missing))

        template_path = pathlib.Path("/run/codex-host/config.toml.template")
        output_path = pathlib.Path("/root/.codex/config.toml")
        content = template_path.read_text(encoding="utf-8")
        for name in (
            "OPENAI_API_KEY",
            "OPENAI_BASE_URL",
            "AUGMENT_API_TOKEN",
            "AUGMENT_API_URL",
            "WINDSURF_API_KEY",
        ):
            # 使用 JSON 字符串语法写入 TOML basic string，避免密钥中的特殊字符破坏配置。
            content = content.replace(f"__{name}__", json.dumps(os.environ.get(name, "")))
        output_path.write_text(content, encoding="utf-8")
        PY
        chmod 600 /root/.codex/config.toml
        exec sleep infinity
    volumes:
      # /root/.codex 必须是可写目录；Codex 会用原子写入持久化 trust/auth 状态。
      - codex-home:/root/.codex
      # 宿主配置只作为启动源文件，避免单文件 bind mount 阻断 Codex 原子覆盖。
      - type: bind
        source: ./config.toml.template
        target: /run/codex-host/config.toml.template
        read_only: true
        bind:
          create_host_path: false
      # 挂载项目目录，容器内默认在 /workspace 工作。
      - ../..:/workspace

volumes:
  codex-home:
