<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,500;10..48,700;10..48,800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // jsdelivr 不可用时自动回退到 unpkg，避免页面失去 Tailwind 样式。
    if (!window.tailwind) {
      const fallbackScript = document.createElement("script");
      fallbackScript.src = "https://unpkg.com/@tailwindcss/browser@4";
      document.head.appendChild(fallbackScript);
    }
    if (!window.marked) {
      const fallbackMarkedScript = document.createElement("script");
      fallbackMarkedScript.src = "https://unpkg.com/marked/marked.min.js";
      document.head.appendChild(fallbackMarkedScript);
    }
  </script>
  <style type="text/tailwindcss">
    @theme {
      --color-background: #e9f1f8;
      --color-foreground: #0d1a2b;

      --color-card: #f8fcff;
      --color-card-foreground: #0d1a2b;

      --color-primary: #0067c7;
      --color-primary-foreground: #eff7ff;

      --color-secondary: #dbe9f5;
      --color-secondary-foreground: #1e3044;

      --color-muted: #e7f2fa;
      --color-muted-foreground: #5b7289;

      --color-accent: #ff7d2f;
      --color-accent-foreground: #fff2e8;

      --color-border: #b9ccde;
      --color-ring: #0067c7;

      --radius-shell: 2rem;
      --radius-card: 1.15rem;
      --radius-pill: 999px;

      --animate-rise: rise 0.45s cubic-bezier(0.21, 1, 0.32, 1) both;
      --animate-fade: fade 0.36s ease both;
      --animate-tilt: tilt 0.6s ease both;

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes tilt {
        from { transform: rotate(-1.2deg) translateY(8px); opacity: 0; }
        to { transform: rotate(0deg) translateY(0); opacity: 1; }
      }
    }

    @custom-variant dark (&:where(.dark, .dark *));

    .dark {
      --color-background: #070f1b;
      --color-foreground: #e7f1ff;
      --color-card: #101b2a;
      --color-card-foreground: #e7f1ff;
      --color-secondary: #17263a;
      --color-secondary-foreground: #d6e6f8;
      --color-muted: #1d2f46;
      --color-muted-foreground: #9cb1c8;
      --color-border: #2d4662;
      --color-ring: #5fb3ff;
      --color-primary: #4aa2ff;
      --color-primary-foreground: #001329;
      --color-accent: #ff9a55;
      --color-accent-foreground: #2f1200;
    }

    @layer base {
      * {
        @apply box-border border-border;
      }

      html,
      body {
        @apply m-0 min-h-screen;
      }

      body {
        font-family: "Noto Sans SC", "PingFang SC", sans-serif;
        @apply bg-background text-foreground antialiased;
        background-image:
          radial-gradient(circle at 8% 8%, color-mix(in oklab, var(--color-primary) 24%, transparent) 0, transparent 40%),
          radial-gradient(circle at 88% 14%, color-mix(in oklab, var(--color-accent) 20%, transparent) 0, transparent 34%),
          linear-gradient(122deg, #e9f1f8 0%, #e2edf7 45%, #f3f8fe 100%);
      }

      .dark body {
        background-image:
          radial-gradient(circle at 8% 10%, color-mix(in oklab, var(--color-primary) 30%, transparent) 0, transparent 42%),
          radial-gradient(circle at 90% 8%, color-mix(in oklab, var(--color-accent) 18%, transparent) 0, transparent 30%),
          linear-gradient(122deg, #070f1b 0%, #0b1625 40%, #050b13 100%);
      }
    }

    @layer components {
      .noise-layer {
        background-image: radial-gradient(rgba(0, 0, 0, 0.08) 0.5px, transparent 0.5px);
        background-size: 2px 2px;
        opacity: 0.2;
      }

      .grid-layer {
        background-image:
          linear-gradient(to right, color-mix(in oklab, var(--color-border) 45%, transparent) 1px, transparent 1px),
          linear-gradient(to bottom, color-mix(in oklab, var(--color-border) 45%, transparent) 1px, transparent 1px);
        background-size: 30px 30px;
        opacity: 0.22;
      }

      .catalog-card {
        @apply relative w-full rounded-[--radius-card] border border-border/80 bg-card/90 p-3 text-left transition-all duration-200;
      }

      .catalog-card::after {
        content: "";
        @apply pointer-events-none absolute inset-0 rounded-[--radius-card] opacity-0 transition-opacity duration-200;
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--color-primary) 45%, transparent);
      }

      .catalog-card:hover {
        @apply -translate-y-0.5 border-primary/45;
      }

      .catalog-card:hover::after {
        @apply opacity-100;
      }

      .catalog-card[data-active="true"] {
        @apply border-primary/70 bg-primary text-primary-foreground shadow-[0_14px_24px_rgba(0,103,199,0.28)];
      }

      .catalog-card[data-active="true"]::after {
        @apply opacity-0;
      }

      .desc-clamp {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .mono {
        font-family: "JetBrains Mono", "SFMono-Regular", monospace;
      }

      .display-font {
        font-family: "Bricolage Grotesque", "Noto Sans SC", sans-serif;
      }

      .md-preview {
        @apply text-[14px] leading-7 text-foreground;
      }

      .md-preview h1 {
        @apply display-font mb-4 mt-1 border-b border-border/80 pb-2 text-3xl font-extrabold;
      }

      .md-preview h2 {
        @apply display-font mb-3 mt-6 border-b border-border/60 pb-1 text-2xl font-bold;
      }

      .md-preview h3 {
        @apply display-font mb-2 mt-5 text-xl font-bold;
      }

      .md-preview p {
        @apply my-3 text-foreground/95;
      }

      .md-preview ul,
      .md-preview ol {
        @apply my-3 pl-6;
      }

      .md-preview li {
        @apply my-1;
      }

      .md-preview blockquote {
        @apply my-4 border-l-4 border-accent bg-accent/8 px-4 py-2 text-foreground/90;
      }

      .md-preview code {
        @apply mono rounded-md bg-muted px-1.5 py-0.5 text-[12px] text-primary;
      }

      .md-preview pre {
        @apply mono my-4 overflow-auto rounded-xl border border-border bg-[#f2f8ff] p-4 text-[12.5px] leading-relaxed text-[#1f3550];
      }

      .dark .md-preview pre {
        @apply border-border bg-[#0f2135] text-[#d4e7ff];
      }

      .md-preview pre code {
        @apply bg-transparent p-0 text-inherit;
      }

      .md-preview a {
        @apply border-b border-primary/35 text-primary no-underline transition hover:border-primary hover:text-primary/80;
      }

      .md-preview table {
        @apply my-4 w-full border-collapse overflow-hidden rounded-xl border border-border;
      }

      .md-preview th,
      .md-preview td {
        @apply border border-border px-3 py-2 text-left align-top;
      }

      .md-preview th {
        @apply bg-secondary font-bold;
      }
    }
  </style>
</head>
<body>
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="noise-layer absolute inset-0"></div>
    <div class="grid-layer absolute inset-0"></div>
    <div class="absolute -left-16 top-10 h-56 w-56 rotate-[12deg] rounded-3xl border border-primary/40 bg-primary/10 blur-[2px]"></div>
    <div class="absolute -right-8 bottom-14 h-64 w-64 rotate-[-14deg] rounded-full border border-accent/35 bg-accent/10 blur-[1px]"></div>
  </div>

  <div class="mx-auto max-w-[1600px] px-4 py-5 sm:px-7 lg:px-10 lg:py-9">
    <section class="relative overflow-hidden rounded-[--radius-shell] border border-border/75 bg-card/78 p-4 shadow-[0_22px_70px_rgba(30,20,8,0.14)] backdrop-blur-md sm:p-6 lg:p-8">
      <div class="pointer-events-none absolute -right-20 -top-24 h-56 w-56 rounded-full bg-primary/18 blur-2xl"></div>
      <div class="pointer-events-none absolute -left-24 bottom-4 h-64 w-64 rounded-full bg-accent/16 blur-3xl"></div>

      <header class="relative grid gap-5 border-b border-border/70 pb-6 lg:grid-cols-[1.2fr_0.8fr] lg:items-end">
        <div class="animate-tilt space-y-4">
          <p class="inline-flex items-center gap-2 rounded-[--radius-pill] border border-primary/35 bg-primary/12 px-3 py-1 text-[11px] font-bold tracking-[0.24em] text-primary uppercase">
            Codex Atlas
          </p>
          <h1 class="display-font max-w-3xl text-3xl font-extrabold leading-[1.02] tracking-[-0.02em] sm:text-4xl lg:text-[3.25rem]">
            Agents &amp; Skills<br>
            内容工具台
          </h1>
          <p class="max-w-3xl text-sm text-muted-foreground sm:text-[15px]">
            左侧目录直接展示名称和描述，支持搜索与分组过滤；右侧显示原始文档内容，适合快速巡检和知识回看。
          </p>
        </div>

        <div class="animate-rise flex flex-wrap items-center justify-start gap-2 lg:justify-end">
          <button id="themeBtn" type="button" class="inline-flex items-center justify-center rounded-xl border border-border bg-card px-4 py-2.5 text-sm font-bold text-foreground transition hover:border-primary/45 hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/40">
            切换夜色
          </button>
          <button id="reloadBtn" type="button" class="inline-flex items-center justify-center rounded-xl bg-primary px-4 py-2.5 text-sm font-bold text-primary-foreground transition hover:brightness-110 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/40">
            重新加载目录
          </button>
        </div>
      </header>

      <div class="relative mt-6 grid min-h-[68vh] gap-4 xl:grid-cols-[380px_minmax(0,1fr)]">
        <aside class="animate-rise rounded-[--radius-card] border border-border/75 bg-secondary/55 p-3 sm:p-4">
          <div class="mb-3 flex items-center justify-between gap-2">
            <h2 class="display-font text-lg font-extrabold tracking-tight">目录导航</h2>
            <span id="catalogCount" class="rounded-[--radius-pill] bg-muted px-3 py-1 text-xs font-bold text-primary">0 / 0</span>
          </div>

          <label for="searchInput" class="mb-2 block text-xs font-bold tracking-[0.16em] text-muted-foreground uppercase">搜索</label>
          <input id="searchInput" type="text" placeholder="输入名称或描述..." class="w-full rounded-xl border border-border bg-card/90 px-3 py-2.5 text-sm text-foreground placeholder:text-muted-foreground/80 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/35">

          <div id="kindFilter" class="mt-3 grid grid-cols-3 gap-2">
            <button data-kind="all" type="button" class="filter-chip">全部</button>
            <button data-kind="agents" type="button" class="filter-chip">Agents</button>
            <button data-kind="skills" type="button" class="filter-chip">Skills</button>
          </div>

          <div id="catalogList" class="mt-4 max-h-[56vh] space-y-4 overflow-auto pr-1"></div>
        </aside>

        <main class="animate-rise rounded-[--radius-card] border border-border/75 bg-card/90 p-4 sm:p-5 lg:p-6">
          <div class="mb-3 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-border/60 bg-secondary/55 px-3 py-2.5">
            <div id="contentMeta" class="text-sm text-muted-foreground">正在加载目录...</div>
            <div class="flex items-center gap-2">
              <div id="viewMode" class="flex items-center gap-1 rounded-full border border-border bg-card/90 p-1">
                <button data-view="preview" type="button" class="view-chip">预览</button>
                <button data-view="raw" type="button" class="view-chip">源码</button>
              </div>
              <div class="mono flex items-center gap-2 text-xs text-muted-foreground">
                <span id="lineCount" class="rounded-full bg-muted px-2 py-1">0 行</span>
                <span id="charCount" class="rounded-full bg-muted px-2 py-1">0 字符</span>
              </div>
            </div>
          </div>

          <div class="relative h-[58vh]">
            <article id="previewPanel" class="md-preview h-full overflow-auto rounded-xl border border-border/70 bg-[#f8fcff] p-4 dark:bg-[#0f2135] sm:p-5"></article>
            <pre id="contentPanel" class="mono hidden h-full overflow-auto rounded-xl border border-border/70 bg-[#eef6ff] p-4 text-[12.5px] leading-relaxed text-[#203852] dark:bg-[#0f2742] dark:text-[#d7e9ff] sm:text-[13px]"></pre>
          </div>
        </main>
      </div>
    </section>
  </div>

  <script>
    const CATALOG_SOURCE = {
      agents: {
        readmePath: "codex/agents/README.md",
        startMarker: "AGENT_CATALOG_START",
        endMarker: "AGENT_CATALOG_END",
        kindLabel: "Agents",
      },
      skills: {
        readmePath: "codex/skills/README.md",
        startMarker: "SKILL_CATALOG_START",
        endMarker: "SKILL_CATALOG_END",
        kindLabel: "Skills",
      },
    };

    const state = {
      items: [],
      activeId: "",
      filterText: "",
      filterKind: "all",
      viewMode: "preview",
      currentContent: "",
      lastLoadedPath: "",
      requestToken: 0,
    };

    function setFilterChipState() {
      document.querySelectorAll("#kindFilter [data-kind]").forEach((button) => {
        const isActive = button.dataset.kind === state.filterKind;
        button.className = [
          "filter-chip rounded-xl border px-2 py-2 text-sm font-bold transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/35",
          isActive
            ? "border-primary/70 bg-primary text-primary-foreground"
            : "border-border bg-card/80 text-muted-foreground hover:border-primary/45 hover:text-primary"
        ].join(" ");
      });
    }

    function setViewChipState() {
      document.querySelectorAll("#viewMode [data-view]").forEach((button) => {
        const isActive = button.dataset.view === state.viewMode;
        button.className = [
          "view-chip rounded-full px-3 py-1.5 text-xs font-bold transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/35",
          isActive
            ? "bg-primary text-primary-foreground"
            : "text-muted-foreground hover:text-primary"
        ].join(" ");
      });
    }

    function applyViewMode() {
      const previewPanel = document.getElementById("previewPanel");
      const rawPanel = document.getElementById("contentPanel");
      const rawMode = state.viewMode === "raw";

      previewPanel.classList.toggle("hidden", rawMode);
      rawPanel.classList.toggle("hidden", !rawMode);
      setViewChipState();
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderMarkdownContent(content) {
      if (window.marked && typeof window.marked.parse === "function") {
        if (typeof window.marked.setOptions === "function") {
          window.marked.setOptions({
            gfm: true,
            breaks: true,
            headerIds: false,
            mangle: false,
          });
        }
        return window.marked.parse(content);
      }
      return `<pre>${escapeHtml(content)}</pre>`;
    }

    function parseCatalogSection(markdown, startMarker, endMarker) {
      const lines = markdown.split(/\r?\n/);
      const start = lines.findIndex((line) => line.includes(startMarker));
      const end = lines.findIndex((line, index) => index > start && line.includes(endMarker));
      if (start === -1 || end === -1) return [];

      const tableLines = lines.slice(start + 1, end).filter((line) => line.trim().startsWith("|"));
      return tableLines
        .map((line) => line.trim())
        .filter((line) => !line.includes("| ---"))
        .map((line) => {
          const columns = line.split("|").slice(1, -1).map((cell) => cell.trim());
          if (columns.length < 3) return null;
          if (columns[0].toLowerCase() === "name") return null;
          return {
            name: columns[0],
            location: columns[1],
            description: columns[2],
          };
        })
        .filter(Boolean);
    }

    function buildItem(kind, entry, index) {
      if (kind === "agents") {
        const filePath = `codex/agents/${entry.location}`;
        return {
          id: `${kind}-${index}`,
          kind,
          groupLabel: CATALOG_SOURCE[kind].kindLabel,
          name: entry.name,
          description: entry.description || "(无描述)",
          paths: [filePath],
          displayPath: filePath,
        };
      }

      const dir = entry.location;
      const primary = `codex/skills/${dir}/SKILL.md`;
      const fallback = `codex/skills/${dir}/skill.md`;
      return {
        id: `${kind}-${index}`,
        kind,
        groupLabel: CATALOG_SOURCE[kind].kindLabel,
        name: entry.name,
        description: entry.description || "(无描述)",
        paths: [primary, fallback],
        displayPath: primary,
      };
    }

    function getFilteredItems() {
      const keyword = state.filterText;
      return state.items.filter((item) => {
        const kindMatch = state.filterKind === "all" || item.kind === state.filterKind;
        if (!kindMatch) return false;
        if (!keyword) return true;
        return item.name.toLowerCase().includes(keyword) || item.description.toLowerCase().includes(keyword);
      });
    }

    function updateCatalogCount(visible, total) {
      document.getElementById("catalogCount").textContent = `${visible} / ${total}`;
    }

    function updateMetrics(content) {
      const lineCount = content ? content.split(/\r?\n/).length : 0;
      document.getElementById("lineCount").textContent = `${lineCount} 行`;
      document.getElementById("charCount").textContent = `${content.length} 字符`;
    }

    function renderContent(content) {
      state.currentContent = content;
      document.getElementById("contentPanel").textContent = content;
      document.getElementById("previewPanel").innerHTML = renderMarkdownContent(content);
      updateMetrics(content);
      applyViewMode();
    }

    function renderCatalogList(items = getFilteredItems()) {
      const container = document.getElementById("catalogList");
      container.innerHTML = "";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "rounded-[--radius-card] border border-border/70 bg-card/70 p-4 text-sm text-muted-foreground";
        empty.textContent = "没有匹配项，请调整搜索词或筛选条件。";
        container.appendChild(empty);
        return;
      }

      ["agents", "skills"].forEach((kind) => {
        const groupItems = items.filter((item) => item.kind === kind);
        if (groupItems.length === 0) return;

        const group = document.createElement("section");
        group.className = "space-y-2";

        const title = document.createElement("h3");
        title.className = "px-1 text-xs font-bold tracking-[0.14em] text-muted-foreground uppercase";
        title.textContent = CATALOG_SOURCE[kind].kindLabel;
        group.appendChild(title);

        groupItems.forEach((item, idx) => {
          const isActive = item.id === state.activeId;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "catalog-card animate-rise";
          button.dataset.active = isActive ? "true" : "false";
          button.style.animationDelay = `${Math.min(idx, 8) * 40}ms`;

          const name = document.createElement("div");
          name.className = "display-font text-[15px] font-extrabold leading-tight";
          name.textContent = item.name;

          const desc = document.createElement("p");
          desc.className = `desc-clamp mt-1 text-xs leading-relaxed ${isActive ? "text-primary-foreground/95" : "text-muted-foreground"}`;
          desc.textContent = item.description;

          button.appendChild(name);
          button.appendChild(desc);

          button.addEventListener("click", () => {
            void activateItem(item.id);
          });

          group.appendChild(button);
        });

        container.appendChild(group);
      });
    }

    async function fetchText(path) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`${path} 读取失败（HTTP ${response.status}）`);
      }
      return response.text();
    }

    async function loadCatalogItems() {
      const entries = [];

      for (const kind of ["agents", "skills"]) {
        const source = CATALOG_SOURCE[kind];
        const readmeText = await fetchText(source.readmePath);
        const rows = parseCatalogSection(readmeText, source.startMarker, source.endMarker);
        rows.forEach((row, idx) => entries.push(buildItem(kind, row, idx)));
      }

      state.items = entries;
    }

    // skills 可能存在 SKILL.md/skill.md 两种命名，按顺序兜底读取。
    async function loadContentFor(item) {
      for (const path of item.paths) {
        try {
          const content = await fetchText(path);
          return { path, content };
        } catch (error) {
          continue;
        }
      }
      throw new Error(`未找到可读取文件：${item.paths.join(" / ")}`);
    }

    function setMetaLoading(text) {
      const meta = document.getElementById("contentMeta");
      meta.textContent = text;
    }

    function setMetaLoaded(item, path) {
      const meta = document.getElementById("contentMeta");
      meta.innerHTML = "";

      const left = document.createElement("span");
      left.className = "font-semibold text-foreground";
      left.textContent = `${item.groupLabel} / ${item.name}`;

      const divider = document.createElement("span");
      divider.className = "mx-2 text-muted-foreground";
      divider.textContent = "·";

      const right = document.createElement("span");
      right.className = "mono text-xs text-muted-foreground";
      right.textContent = path;

      meta.appendChild(left);
      meta.appendChild(divider);
      meta.appendChild(right);
    }

    async function activateItem(itemId, options = {}) {
      const { rerender = true } = options;
      state.activeId = itemId;
      if (rerender) renderCatalogList();

      const item = state.items.find((row) => row.id === itemId);
      if (!item) return;

      const currentToken = ++state.requestToken;
      setMetaLoading(`正在读取 ${item.displayPath} ...`);
      renderContent("");

      try {
        const result = await loadContentFor(item);
        if (currentToken !== state.requestToken) return;

        state.lastLoadedPath = result.path;
        setMetaLoaded(item, result.path);
        renderContent(result.content);
      } catch (error) {
        if (currentToken !== state.requestToken) return;

        state.lastLoadedPath = "";
        setMetaLoading(`${item.groupLabel} / ${item.name}`);
        renderContent(`读取失败：${error.message}`);
      }
    }

    function applyFilters() {
      const filtered = getFilteredItems();
      updateCatalogCount(filtered.length, state.items.length);

      if (filtered.length === 0) {
        state.activeId = "";
        renderCatalogList(filtered);
        setMetaLoading("没有可展示项");
        renderContent("当前筛选条件下没有匹配目录。");
        return;
      }

      const exists = filtered.some((item) => item.id === state.activeId);
      const nextId = exists ? state.activeId : filtered[0].id;
      const shouldLoad = nextId !== state.activeId || !state.lastLoadedPath;

      state.activeId = nextId;
      renderCatalogList(filtered);
      if (shouldLoad) {
        void activateItem(nextId, { rerender: false });
      }
    }

    function initTheme() {
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
      updateThemeButtonLabel();
    }

    function updateThemeButtonLabel() {
      const button = document.getElementById("themeBtn");
      const dark = document.documentElement.classList.contains("dark");
      button.textContent = dark ? "切换亮色" : "切换夜色";
    }

    async function init() {
      setMetaLoading("正在加载目录...");
      renderContent("");

      try {
        await loadCatalogItems();
        applyFilters();
      } catch (error) {
        updateCatalogCount(0, 0);
        document.getElementById("catalogList").innerHTML = "";
        setMetaLoading("加载失败");
        renderContent(`初始化失败：${error.message}`);
      }
    }

    document.getElementById("searchInput").addEventListener("input", (event) => {
      state.filterText = event.target.value.trim().toLowerCase();
      applyFilters();
    });

    document.querySelectorAll("#kindFilter [data-kind]").forEach((button) => {
      button.addEventListener("click", () => {
        state.filterKind = button.dataset.kind;
        setFilterChipState();
        applyFilters();
      });
    });

    document.querySelectorAll("#viewMode [data-view]").forEach((button) => {
      button.addEventListener("click", () => {
        state.viewMode = button.dataset.view;
        applyViewMode();
      });
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
      updateThemeButtonLabel();
    });

    document.getElementById("reloadBtn").addEventListener("click", () => {
      state.lastLoadedPath = "";
      void init();
    });

    initTheme();
    state.filterKind = "all";
    setFilterChipState();
    setViewChipState();
    applyViewMode();
    void init();
  </script>
</body>
</html>
